<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>TerminalOS</title><style>:root{color-scheme:dark;--red:#ff5f57;--yellow:#febc2e;--green:#28c840}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;overscroll-behavior:none}.app{position:fixed;inset:0;background:#000;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column}.titlebar{height:42px;display:flex;align-items:center;gap:11px;flex-shrink:0}.dot{width:13px;height:13px;border:0;border-radius:50%;padding:0;cursor:pointer;transition:transform .14s}.red{background:var(--red)}.yellow{background:var(--yellow)}.green{background:var(--green)}.dot:active{transform:scale(.88)}.canvas{flex:1;min-height:0;background:#000}.notice{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 60px);transform:translate(-50%,-8px);padding:9px 13px;border:1px solid #272727;border-radius:10px;background:#111;color:#aaa;font-size:12px;opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .18s,transform .18s}.notice.show{opacity:1;transform:translate(-50%,0)}@media(min-width:600px){.app{padding:22px}.titlebar{height:36px}.dot{width:12px;height:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="app" aria-label="TerminalOS"><header class="titlebar" aria-label="Commandes de fenêtre macOS"><button class="dot red" aria-label="Fermer la fenêtre" title="Fermer" data-action="close"></button><button class="dot yellow" aria-label="Réduire la fenêtre" title="Réduire" data-action="minimize"></button><button class="dot green" aria-label="Plein écran" title="Plein écran" data-action="fullscreen"></button></header><section class="canvas" aria-label="Écran noir TerminalOS"></section><div class="notice" role="status" aria-live="polite"></div></main><script>(()=>{const n=document.querySelector('.notice');let t;function show(s){n.textContent=s;n.classList.add('show');clearTimeout(t);t=setTimeout(()=>n.classList.remove('show'),1500)}document.querySelector('[data-action="close"]').addEventListener('click',()=>show('TerminalOS — fenêtre fictive'));document.querySelector('[data-action="minimize"]').addEventListener('click',()=>show('Mode réduit simulé'));document.querySelector('[data-action="fullscreen"]').addEventListener('click',async()=>{try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else if(document.fullscreenElement&&document.exitFullscreen)await document.exitFullscreen()}catch(_){show('Plein écran contrôlé par le navigateur')}})})();</script></body></html>
